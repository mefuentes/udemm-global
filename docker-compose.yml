version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: udemm_global_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT}:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: udemm_global_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - '${BACKEND_PORT}:5000'
    depends_on:
      - postgres
    volumes:
      - ./backend:/usr/src/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udemm_global_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - '${FRONTEND_PORT}:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app

volumes:
  postgres-data:
    name: udemm_global_postgres_data
