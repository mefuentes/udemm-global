<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UDEMM Global · MOD-AUT Autoevaluaciones</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#EFF3F8;color:#1E2F3E;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
button,input,textarea,select{font-family:inherit;font-size:inherit}
/* Topbar */
.topbar{height:52px;background:#0E2438;display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:30px;height:30px;background:#103254;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#3D9BE9;font-size:14px}
.brand{font-size:14px;font-weight:600;color:#E8EEF4;line-height:1.1}.brand span{color:#3D9BE9}
.ver{font-size:9px;color:#5C7089;letter-spacing:1px;margin-top:2px}
.sepv{width:1px;height:24px;background:rgba(255,255,255,.1)}
.crumb{font-size:12px;color:#6E8398;display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.crumb a{color:#9DB1C4;cursor:pointer}.crumb a:hover{color:#fff;text-decoration:underline}.crumb b{color:#DCE6F0;font-weight:500}
.uchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 10px}
.uav{width:22px;height:22px;background:#1A6BB0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff}
.un{font-size:12px;color:#E0EAF4;font-weight:500}.ur{font-size:10px;color:#5C7089}
/* Layout */
.app{display:flex;flex:1;overflow:hidden}
.nav{width:236px;background:#0A1C2E;border-right:1px solid rgba(255,255,255,.06);padding:12px 10px;flex-shrink:0;overflow-y:auto}
.nav h6{font-size:9px;color:#3D5268;letter-spacing:1.2px;text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#8CA5B9;font-size:13px;cursor:pointer;margin-bottom:2px;user-select:none}
.ni:hover{background:#0F2A42;color:#cbdae6}.ni.act{background:#16395C;color:#5BB0F0}
.ni .num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.07);color:#8CA5B9;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ni.act .num{background:#1A6BB0;color:#fff}
.ni .bd{margin-left:auto;background:#E24B4A;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.navhelp{margin:16px 6px 4px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.04);font-size:11px;color:#6E8398;line-height:1.5}
.main{flex:1;overflow-y:auto}
.page{padding:22px 26px 48px;max-width:1240px;margin:0 auto}
.ph{margin-bottom:16px}.ph h1{font-size:21px;font-weight:700;color:#16344F}
.ph p{font-size:13px;color:#6B7B8C;margin-top:4px;max-width:760px;line-height:1.55}
/* Comunes */
.card{background:#fff;border:.5px solid #E1E6EC;border-radius:14px}
.cp{padding:16px 18px}
.g{display:grid;gap:14px}
.h2{font-size:12px;font-weight:600;color:#4A6580;letter-spacing:.5px;text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.h2 small{font-weight:400;text-transform:none;letter-spacing:0;color:#8A9BB0;font-size:12px}
.muted{color:#8A9BB0}.small{font-size:11px}
.btn{background:#1A6BB0;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:500;cursor:pointer}
.btn:hover{background:#155A94}.btn.sm{padding:5px 12px;font-size:12px}
.btn.ghost{background:#fff;color:#4A6580;border:.5px solid #D5DCE4}.btn.ghost:hover{background:#F4F8FC;color:#1A6BB0;border-color:#BDD6EF}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#1A6BB0;font-weight:500;cursor:pointer;padding:0;margin-bottom:12px}
.back:hover{text-decoration:underline}
.note{border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.55;display:flex;gap:8px;margin-bottom:14px}
.note.info{background:#EBF4FF;border:.5px solid #BDD6EF;color:#1E507A}
.note.warn{background:#FFF1E0;border:.5px solid #F0C98C;color:#7A4E0D}
.tag{font-size:10px;font-weight:500;background:#EEF2F6;color:#4A6580;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}
/* Semáforo (siempre color + texto) */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.sem i{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.sem.r{background:#FDE8E8;color:#B93635}.sem.a{background:#FFF1E0;color:#8A5A0B}.sem.v{background:#e9f4e9;color:#1E7A56}.sem.i{background:#EBF4FF;color:#1A6BB0}
.pill{font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;display:inline-block;white-space:nowrap}
.pill.r{background:#FDE8E8;color:#B93635}.pill.a{background:#FFF1E0;color:#8A5A0B}.pill.v{background:#e9f4e9;color:#1E7A56}.pill.g{background:#EEF2F6;color:#4A6580}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:.5px solid #E1E6EC;border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;color:#6B7B8C}.kpi>.v{font-size:26px;font-weight:600;color:#16344F;margin-top:4px;line-height:1.1}
.kpi>.v small{font-size:12px;font-weight:400;color:#8A9BB0;margin-left:4px}.kpi .s{font-size:11px;color:#8A9BB0;margin-top:4px;line-height:1.4}
.trio{display:flex;gap:18px;margin-top:6px}.trio div b{display:block;font-size:22px;font-weight:600;color:#16344F}.trio div span{font-size:11px;color:#8A9BB0}
/* Tiles resumen */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{background:#fff;border:.5px solid #E1E6EC;border-radius:14px;padding:16px 18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;border-top:4px solid #C0CEDD}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.tile.r{border-top-color:#E24B4A}.tile.a{border-top-color:#EF9F27}.tile.v{border-top-color:#1E9E73}
.tile .sem{align-self:flex-start}
.tile .tt{font-size:11px;color:#8A9BB0;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.tile .tn{font-size:15px;font-weight:600;color:#16344F;line-height:1.3}
.tile .ts{font-size:12px;color:#6B7B8C;line-height:1.5}
.tile .tl{font-size:12px;color:#1A6BB0;font-weight:500;margin-top:auto;padding-top:6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step{display:flex;gap:10px;font-size:12px;color:#4A6580;line-height:1.45}
.step b{width:22px;height:22px;border-radius:50%;background:#1A6BB0;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step strong{color:#16344F;display:block}
/* Alertas */
.al{display:flex;gap:12px;align-items:flex-start;background:#fff;border:.5px solid #E1E6EC;border-left:4px solid #C0CEDD;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.al.alta{border-left-color:#E24B4A}.al.media{border-left-color:#EF9F27}.al.info{border-left-color:#3D9BE9}
.al .ai{width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:#fff}
.al.alta .ai{background:#E24B4A}.al.media .ai{background:#EF9F27}.al.info .ai{background:#3D9BE9}
.al .ab{flex:1;min-width:0}.al .at{font-size:13px;font-weight:600;color:#16344F}
.al .ad{font-size:12px;color:#4A6580;margin-top:3px;line-height:1.5}.al .ae{font-size:11px;color:#8A9BB0;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:#fff;border:.5px solid #D5DCE4;border-radius:20px;padding:6px 14px;font-size:12px;color:#4A6580;cursor:pointer;user-select:none}
.chip:hover{border-color:#1A6BB0;color:#1A6BB0}.chip.on{background:#1A6BB0;border-color:#1A6BB0;color:#fff}
.chip b{font-weight:700;margin-left:4px}
/* Tablas */
.tbl{background:#fff;border:.5px solid #E1E6EC;border-radius:14px;overflow:hidden}
.th,.tr{display:grid;gap:10px;padding:10px 16px;align-items:center;font-size:12.5px}
.th{background:#EEF2F6;font-size:11px;font-weight:600;color:#6B7B8C}
.tr{border-top:.5px solid #EEF2F6;color:#2C3E50}.tr.click{cursor:pointer}.tr.click:hover{background:#F6FAFE}
.obs{font-size:11px;color:#8A5A0B;margin-top:3px;line-height:1.45}
.lnk{color:#1A6BB0;cursor:pointer;font-weight:500}.lnk:hover{text-decoration:underline}
/* Barras */
.bar{height:8px;background:#EEF2F6;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.bl{display:grid;grid-template-columns:140px 1fr 44px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px;color:#4A6580}
.bl b{text-align:right;color:#16344F}
.hb{display:grid;grid-template-columns:190px 1fr 230px;gap:12px;align-items:center;margin-bottom:14px;font-size:12px}
.hbt{position:relative;height:14px;background:#EEF2F6;border-radius:7px}
.hbt i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.hbt u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#16344F;text-decoration:none}
/* Tarjetas de carrera */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ccard{background:#fff;border:.5px solid #E1E6EC;border-radius:14px;padding:18px;cursor:pointer;border-top:4px solid #C0CEDD;transition:.15s;display:flex;flex-direction:column;gap:12px}
.ccard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.ccard.r{border-top-color:#E24B4A}.ccard.a{border-top-color:#EF9F27}.ccard.v{border-top-color:#1E9E73}
.ccard h3{font-size:16px;color:#16344F}.ccard .pl{font-size:12px;color:#8A9BB0;margin-top:2px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{background:#F6F9FC;border-radius:10px;padding:9px 11px}.mini span{display:block;font-size:11px;color:#8A9BB0}.mini b{font-size:15px;color:#16344F}
.mini b.bad{color:#B93635}.mini b.ok{color:#1E7A56}
/* Modal */
.mbg{position:fixed;inset:0;background:rgba(10,28,46,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.mdl{background:#fff;border-radius:16px;width:760px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{padding:16px 22px;border-bottom:.5px solid #EEF2F6;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:16px;color:#16344F}.mh .x{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:#8A9BB0;line-height:1}
.mb{padding:18px 22px 22px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kv span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#8A9BB0}.kv b{font-size:13px;color:#16344F}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EEF2F6;margin:6px 0}
.stack i{display:block;height:100%}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#6B7B8C}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.ck{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}.ck .y{color:#1E7A56}.ck .n{color:#B93635;font-weight:600}
/* Formulario */
.dtabs{display:flex;gap:6px;border-bottom:1px solid #E1E6EC;margin-bottom:16px}
.dtab{padding:10px 18px;font-size:13px;font-weight:500;color:#6B7B8C;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtab.on{color:#1A6BB0;border-bottom-color:#1A6BB0}.dtab:hover{color:#1A6BB0}
.crit{margin-bottom:14px;overflow:hidden}
.crit>.hd{padding:13px 18px;background:#F9FBFD;border-bottom:.5px solid #EEF2F6;display:flex;gap:12px;align-items:center}
.crit .id{background:#16395C;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.crit .q{font-size:12px;color:#6B7B8C;margin-top:2px}
.crit .bd{padding:16px 18px;display:grid;grid-template-columns:270px 1fr;gap:20px}
.dato{background:#F6F9FC;border-radius:10px;padding:12px 14px;align-self:start}
.dato .dl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#8A9BB0;font-weight:600}
.dato .dv{font-size:14px;font-weight:600;color:#16344F;margin:6px 0;line-height:1.35}
.dato .dn{font-size:11px;color:#6B7B8C;margin-top:6px;line-height:1.45}
.lvl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lvl label{display:flex;align-items:center;gap:6px;border:.5px solid #D5DCE4;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;color:#4A6580}
.lvl label:has(input:checked){border-color:#1A6BB0;background:#EBF4FF;color:#1A6BB0;font-weight:600}
.fl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#8A9BB0;display:block;margin:10px 0 4px}
textarea,input[type=text]{width:100%;border:.5px solid #D5DCE4;border-radius:8px;padding:8px 10px;color:#1E2F3E;background:#fff;outline:none}
textarea{min-height:64px;resize:vertical;line-height:1.5}textarea:focus,input[type=text]:focus{border-color:#1A6BB0}
.pg{height:8px;background:#EEF2F6;border-radius:5px;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:#1E9E73}
/* Umbrales */
details.umb{margin-top:10px}details.umb summary{cursor:pointer;font-weight:600;color:#1A6BB0;padding:10px 0}
.ug{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.ug label{font-size:11px;color:#6B7B8C;display:block;margin-bottom:3px}
.ug input{width:100%;border:.5px solid #D5DCE4;border-radius:8px;padding:6px 9px}
.ug .rg{display:flex;gap:6px}
/* Indicadores de completitud y consistencia */
.ind{display:grid;grid-template-columns:88px 1fr 38px;gap:8px;align-items:center;font-size:11.5px;color:#4A6580;margin-top:5px}
.ind b{text-align:right;font-size:12px}.ind b.v{color:#1E7A56}.ind b.a{color:#8A5A0B}.ind b.r{color:#B93635}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
/* Bienvenida y tableros */
.wcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wc{background:#fff;border:.5px solid #E1E6EC;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.wc .wi{width:44px;height:44px;border-radius:12px;background:#EBF4FF;color:#1A6BB0;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.wc h3{font-size:16px;color:#16344F}.wc .wd{font-size:12px;color:#6B7B8C;line-height:1.5;margin-top:2px}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{font-size:10.5px;font-weight:600;font-family:ui-monospace,monospace;background:#EEF2F6;color:#4A6580;border-radius:6px;padding:2px 7px;cursor:help}
.wsel{display:grid;gap:10px;min-height:58px}
.wsel label,.csel label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#8A9BB0;display:block;margin-bottom:4px}
.wsel select,.csel select{width:100%;border:.5px solid #D5DCE4;border-radius:8px;padding:7px 10px;background:#fff;color:#1E2F3E}
.wfix{font-size:12px;color:#4A6580;background:#F6F9FC;border-radius:8px;padding:9px 11px}
.wrun{font-size:12px;color:#6B7B8C;background:#F6F9FC;border-radius:10px;padding:10px 12px;line-height:1.5;min-height:58px}.wrun b{color:#16344F}
.wact{display:flex;gap:8px;flex-wrap:wrap}.wact .btn{flex:1;white-space:nowrap;text-align:center}
.wact.top{margin-top:auto}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:.5px solid #E1E6EC;border-radius:12px;padding:10px 14px;margin-bottom:16px}
.runbar .rt{flex:1;min-width:220px;font-size:12px;color:#6B7B8C;line-height:1.5}.runbar .rt b{color:#16344F}
.csel{min-width:240px}
/* Informe imprimible (solo visible al generar el PDF) */
#rep{display:none}
@page{size:A4;margin:16mm 14mm 18mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font:9px Inter,sans-serif;color:#8A9BB0}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.printing{height:auto;overflow:visible;background:#fff;display:block;font-size:11px}
 body.printing .topbar,body.printing .app{display:none!important}
 body.printing #rep{display:block}
 .rh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #16344F;padding-bottom:10px}
 .rbr{font-size:10px;font-weight:600;color:#16344F;letter-spacing:.5px}.rbr span{color:#1A6BB0}
 .rty{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8A9BB0;margin-top:8px}
 .rh h1{font-size:20px;color:#16344F;margin:2px 0}.rst{text-align:right}.rdt{font-size:10px;color:#6B7B8C;margin-top:6px}
 .rind{max-width:330px;margin:10px 0 4px}
 #rep h2{font-size:12px;color:#16344F;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;padding-bottom:4px;border-bottom:.5px solid #D5DCE4;break-after:avoid}
 .rkv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 14px;margin-bottom:8px}
 .rkv span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#8A9BB0}.rkv b{font-size:11px;color:#16344F}
 .rck{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px}.rck .y{color:#1E7A56}.rck .n{color:#B93635;font-weight:600}
 table.rt{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:10.5px}
 .rt th{background:#EEF2F6;color:#4A6580;text-align:left;font-weight:600;padding:5px 7px;font-size:9.5px}
 .rt td{padding:5px 7px;border-bottom:.5px solid #E1E6EC;vertical-align:top;color:#2C3E50;line-height:1.4}
 .rt tr{break-inside:avoid}
 .rft{margin-top:22px;padding-top:6px;border-top:.5px solid #D5DCE4;font-size:9px;color:#8A9BB0}}
@media(max-width:1000px){.wcards{grid-template-columns:1fr}.kpis.k3,.kpis,.tiles,.steps{grid-template-columns:repeat(2,1fr)}.cards3{grid-template-columns:1fr}.crit .bd{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}.ug{grid-template-columns:1fr}}
@media(max-width:760px){.app{flex-direction:column}.nav{width:100%;display:flex;overflow-x:auto;padding:6px;gap:4px}.nav h6,.navhelp{display:none}.ni{white-space:nowrap}.kpis,.tiles,.steps{grid-template-columns:1fr}.page{padding:16px 14px 40px}.uchip{display:none}.th{display:none}.tr{grid-template-columns:1fr!important}.hb{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><i class="fas fa-chart-pie"></i></div>
  <div><div class="brand">UDEMM <span>GLOBAL</span></div><div class="ver">MOD-AUT · AUTOEVALUACIONES</div></div>
  <div class="sepv"></div>
  <div class="crumb" id="crumb"></div>
  <div class="uchip"><div class="uav">SA</div><div><div class="un">Sec. Académica</div><div class="ur">Administrador</div></div></div>
</header>
<div id="rep"></div>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<script>
'use strict';
/* ==========================================================================
   MOD-AUT · Autoevaluaciones (módulo aislado)
   Los datos de abajo son SIMULADOS. En la plataforma se reemplazan por lo que

const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};

/* Dedicación calculada (MOD-DOC v8.1 no la declara): docencia de las vinculaciones + gestión + investigación + vinculación.
   En el simulado: tiempos.inv = horas de investigación, tiempos.ext = horas de vinculación, noac = desempeño no académico. */
const fun=d=>({doc:hsDoc(d),ges:hsGes(d),inv:d.tiempos.inv,vin:d.tiempos.ext,noac:d.noac||0});
const dedTot=d=>{const f=fun(d);return f.doc+f.ges+f.inv+f.vin};

  return r;
}
/* Formación práctica del plan (R-13 · IPL-08): obligatorias + PPS + Proyecto Integrador + la electiva de menor hp.
   est: ok = cumple · bajo = por debajo del mínimo · nv = no verificable (asignaturas sin campo 7) */
function fpPlan(p){
  const falt=[...p.asig.filter(a=>a.hp==null).map(a=>a.m),...p.el.filter(e=>e[1]==null).map(e=>e[0])];
  const el=p.el.length?Math.min(...p.el.map(e=>e[1]||0)):0;
  const h=p.asig.reduce((s,a)=>s+(a.hp||0),0)+p.pps+p.pi+el;
  return {h,falt,est:falt.length?'nv':h>=p.umb.minFP?'ok':'bajo'};
}
const fpTxt=f=>f.est==='ok'?'Cumple el mínimo':f.est==='bajo'?'Por debajo del mínimo':`No verificable (${f.falt.length} asignatura${f.falt.length>1?'s':''} sin datos: ${f.falt.join(', ')})`;

      const rs=responsables(p.id,a.m);
      if(!rs.length)
        add({r:8,sev:'alta',amb:'cruzadas',carrera:p.id,asig:a.m,titulo:'Materia sin responsable de cátedra',detalle:`${a.m} no tiene ningún responsable de cátedra vigente.`});
      const por={};rs.forEach(x=>(por[x.cat]=por[x.cat]||[]).push(x.d));
      Object.keys(por).forEach(cat=>{
        if(por[cat].length>1)
          add({r:2,sev:'alta',amb:'cruzadas',carrera:p.id,asig:a.m,docIds:por[cat].map(d=>d.id),titulo:'Doble responsable de cátedra',detalle:`${a.m} (${cat}) tiene ${por[cat].length} responsables vigentes a la vez: ${por[cat].map(d=>d.nombre).join(' y ')}.`});
      });
      if(a.pr.length)
        add({r:11,sev:a.av<50?'alta':'media',amb:'planes',carrera:p.id,asig:a.m,titulo:'Inconsistencia en el programa de la asignatura',detalle:`${a.m} (${a.av}% de avance): ${a.pr.join(' · ')}.`});
      if(a.hp>a.ht)
        add({r:14,sev:'media',amb:'planes',carrera:p.id,asig:a.m,titulo:'Horas prácticas mayores que la carga de la asignatura',detalle:`Declara ${a.hp} h de formación práctica sobre ${a.ht} h de la asignatura.`});
    });
  });
  const ord={alta:0,media:1,info:2};
  const ent=a=>a.carrera?(a.asig||planOf(a.carrera).carrera):docOf(a.docIds[0]).nombre;
  return A.sort((x,y)=>ord[x.sev]-ord[y.sev]||x.r-y.r||ent(x).localeCompare(ent(y),'es'));
}

const semOf=al=>al.some(a=>a.sev==='alta')?'r':al.some(a=>a.sev==='media')?'a':'v';

function statC(A,p){
  const al=A.filter(a=>a.carrera===p.id);
  const docs=new Set();
  DOC.forEach(d=>vig(d).forEach(c=>c.asig.forEach(a=>{if(a.car===p.id)docs.add(d.id)})));
  return {al,sem:indPlan(p).sem,
    blOk:Object.keys(p.umb.minBloque).filter(k=>p.bloques[k]>=p.umb.minBloque[k]).length,
    totOk:p.total>=p.umb.minTotal,
    sinR:al.filter(a=>a.r===8).length,
    prog:p.asig.filter(a=>a.pr.length).length,
    fp:fpPlan(p),
    nd:docs.size};
}

/* ---------- Indicadores: Completitud (qué falta cargar) y Consistencia (qué está mal cargado) ----------
   Completitud docente = ítems cumplidos / 4 (datos personales obligatorios · título de grado · área de desempeño · cargo vigente con vinculación)
   Completitud plan    = (avance promedio de programas + % asignaturas con responsable) / 2
   Consistencia        = 100 − 25 × alertas altas − 10 × alertas medias (mínimo 0)
     docente: reglas 3, 4, 7 · plan: reglas 2, 9, 13, 14 y 11 (solo ítems repetidos, −10 c/u)
   Colores: verde ≥ 90 · amarillo 60–89 · rojo < 60. El semáforo toma el menor de los dos. */
const band=v=>v>=90?'v':v>=60?'a':'r';
const BCOL={v:'#1E9E73',a:'#EF9F27',r:'#E24B4A'};
const penal=al=>Math.max(0,100-25*al.filter(a=>a.sev==='alta').length-10*al.filter(a=>a.sev==='media').length);
function indDoc(d){
  const it=Object.keys(FICHA).map(k=>fichaOk(d,k));
  const comp=pct(it.filter(Boolean).length,it.length);
  // si no tiene ninguna asignación aprobada (ítem 4 sin cumplir), la regla 4 no resta: el hecho ya resta en completitud
  const cons=penal(A.filter(a=>[3,4,7].includes(a.r)&&a.docIds.includes(d.id)&&!(a.r===4&&!fichaOk(d,'docencia'))));
  return {comp,cons,sem:band(Math.min(comp,cons))};
}
function indPlan(p){
  const av=mean(p.asig.map(a=>a.av)),cr=100*p.asig.filter(a=>responsables(p.id,a.m).length).length/p.asig.length;
  const comp=Math.round((av+cr)/2);
  const rep=p.asig.filter(a=>a.pr.some(x=>/repetid/i.test(x))).length;
  const cons=Math.max(0,penal(A.filter(a=>a.carrera===p.id&&[2,9,13,14].includes(a.r)))-10*rep);
  return {comp,cons,sem:band(Math.min(comp,cons)),av:Math.round(av),cr:Math.round(cr)};
}
function indPlantel(L=DOC){
  const xs=L.map(indDoc),comp=Math.round(mean(xs.map(x=>x.comp))),cons=Math.round(mean(xs.map(x=>x.cons)));
  return {comp,cons,sem:band(pct(xs.filter(x=>x.sem==='v').length,xs.length)),xs}; // semáforo del plantel = % de docentes en orden
}

  return {docs:L,al:A.filter(a=>R.includes(a.r)&&!a.carrera&&a.docIds.some(id=>ids.has(id)))};

function runTxt(g){
  const t=runOf(g);

function resHTML(g){
  const h=`<div class="h2">Resultado del análisis <small>— reglas ${GRUPOS[g].r.map(rcod).join(' · ')}</small></div>`;

function plantelStats(L=DOC,car=null){
  const N=L.length,I=indPlantel(L),ids=new Set(L.map(d=>d.id));
  const cargosV=L.reduce((s,d)=>s+vig(d).length,0);
  const asg=new Set();L.forEach(d=>asigs(d).forEach(a=>asg.add(a.car+'|'+a.mat)));
  const PP=car?[planOf(car)]:PLANES;
  const matTot=PP.reduce((s,p)=>s+p.asig.length,0),matCub=PP.reduce((s,p)=>s+p.asig.filter(a=>asg.has(p.id+'|'+a.m)).length,0);
  const pos=L.filter(d=>d.posgrado).length,inv=L.filter(d=>d.invest).length,pg=k=>L.filter(d=>d.posgrado===k).length;
  const rd=RANGOS.map(r=>L.filter(d=>rangoDed(d)===r).length),rdTxt=RANGOS.map((r,i)=>`${r}: ${rd[i]} (${pct(rd[i],N)}%)`).join(' · ');
  let np=0,na=0;L.forEach(d=>vig(d).forEach(c=>/^Prof\./.test(c.cargo)?np++:na++));
  // IP-16: docente regular = al menos un cargo vigente con designación Regular (Rentado o Ad Honorem)
  const reg=L.filter(d=>vig(d).some(c=>/^Regular/.test(c.desig))).length;
  let cReg=0,cInt=0;L.forEach(d=>vig(d).forEach(c=>{if(/^Regular/.test(c.desig))cReg++;else if(/^Interino/.test(c.desig))cInt++;}));
  const dist={v:0,a:0,r:0};I.xs.forEach(x=>dist[x.sem]++);
  const mine=al=>al.filter(a=>a.docIds.some(id=>ids.has(id)));
  const altas=L.filter(d=>A.some(a=>a.sev==='alta'&&a.docIds.includes(d.id)));
  const sob=mine(cnt([7])),baja=mine(cnt([10])),sinAct=mine(cnt([4]));
  const nomb=l=>l.length?[...new Set(l.map(a=>docOf(a.docIds[0]).nombre))].join(', '):'Ninguno';
  // R-06 (Facultad): todas las materias del docente · R-15 (carrera): solo las materias de esa carrera
  const mats=car?L.map(d=>matsCar(d,car)):L.map(nMat),mMed=median(mats),mProm=mean(mats),mMax=mats.length?Math.max(...mats):0;
  const vin=L.filter(d=>d.tiempos.ext>0).length,dprom=mean(L.map(dedTot)),tope=L.filter(d=>tope60(d)>CFG.tope).length;
  const resp=L.filter(d=>vig(d).some(c=>c.asig.some(a=>a.resp))).length;
  return {mMed,mProm,mMax,N,I,cargosV,matTot,matCub,pos,inv,pg,rd,rdTxt,np,na,reg,cReg,cInt,dist,altas,sob,baja,sinAct,nomb,vin,dprom,tope,resp};
}

  <div class="kpis">${K('Docentes vigentes',st.N)}${K('Cargos vigentes',st.cargosV)}${K('Relación profesores / auxiliares',st.na?`${fmt(st.np/st.na)} : 1`:'—',`${st.np} cargos de profesor · ${st.na} de auxiliar`)}${K('Con designación regular',`${pct(st.reg,st.N)}%<small>${st.reg} de ${st.N}</small>`,`Cargos vigentes: ${st.cReg} regulares · ${st.cInt} interinos`)}</div>
  <div class="g" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="card cp"><div class="h2" style="margin-top:0">Docentes por carrera <small>— un docente puede dictar en varias</small></div>${barList(PLANES.map(p=>[esc(p.carrera),docsCar(p.id).length]),st.N)}</div>
    <div class="card cp"><div class="h2" style="margin-top:0">Formación <small>— máximo nivel alcanzado</small></div>${barList(nv,st.N)}</div></div>
  <div class="h2">Investigación, vinculación y dedicaciones</div>
  <div class="kpis">${K('Con posgrado',`${pct(st.pos,st.N)}%<small>${st.pos} de ${st.N}</small>`)}${K('Con actividad de investigación',`${pct(st.inv,st.N)}%<small>${st.inv} de ${st.N}</small>`)}${K('Con actividad de vinculación',`${pct(st.vin,st.N)}%<small>${st.vin} de ${st.N}</small>`)}${K('Dedicación total promedio',`${fmt(st.dprom)}<small>h</small>`,`${st.tope} docente${st.tope===1?'':'s'} supera${st.tope===1?'':'n'} el tope de ${CFG.tope} h`)}</div>
  <div class="card cp" style="margin-top:14px"><div class="l small muted">Dedicación total por rangos</div>
    <div class="stack" style="height:18px;margin:8px 0" role="img" aria-label="Docentes por rango de dedicación">${st.rd.map((v,i)=>v?`<i style="width:${v/st.N*100}%;background:${RCOL[i]}" title="${RANGOS[i]}: ${v}"></i>`:'').join('')}</div>
    <div class="leg">${RANGOS.map((r,i)=>`<span><i style="background:${RCOL[i]}"></i>${r}: <b>${st.rd[i]}</b></span>`).join('')}</div></div>
  <div class="h2">Carga académica</div>
  <div class="kpis k3">${K('Materias por docente (mediana) · R-06',fmt(st.mMed),`Promedio ${fmt(st.mProm)} · máximo ${st.mMax}`)}${K('Responsables de cátedra',st.resp,'Docentes con al menos una cátedra a cargo')}${K('Materias cubiertas',`${st.matCub}<small>de ${st.matTot}</small>`,'Todas las carreras')}</div>`+resHTML('fac');
}

function hbRow(label,h,min){
  const sc=Math.max(h,min)*1.12,ok=h>=min;
  return `<div class="hb"><span><b>${label}</b></span><div class="hbt"><i style="width:${h/sc*100}%;background:${ok?'#1E9E73':'#E24B4A'}"></i><u style="left:${min/sc*100}%" title="Mínimo ${min} h"></u></div>
    <span>${h} h de ${min} h mínimas · ${ok?'<span class="pill v">Cumple</span>':`<span class="pill r">Faltan ${min-h} h</span>`}</span></div>`;
}
function vCarrera(){
  const p=planOf(S.carP),s=statC(A,p),x=indPlan(p);
  const cols='2.3fr .4fr .6fr 1.9fr 1.1fr';
  const lista=p.asig.filter(a=>!S.fasig||A.some(z=>z.carrera===p.id&&z.asig===a.m));
  const rows=lista.map(a=>{
    const rs=responsables(p.id,a.m);
    const resp=rs.length?rs.map(r=>`<span class="lnk" data-act="go" data-s="docente" data-v="${r.d.id}">${esc(r.d.nombre)}</span>${r.cat!=='Única'?` <span class="small muted">(${r.cat})</span>`:''}`).join('<br>'):'<span class="muted">—</span>';
    const col=a.av<50?'#E24B4A':a.av<100?'#EF9F27':'#1E9E73';
    return `<div class="tr" style="grid-template-columns:${cols};align-items:start"><span><b>${esc(a.m)}</b></span><span>${a.a}°</span><span>${a.b}</span><span>${resp}</span>
      <span><div class="bar"><i style="width:${a.av}%;background:${col}"></i></div><span class="small muted">${a.av}% completo</span></span></div>`}).join('');
  return `<div class="hdr"><div class="ph"><h1>Plan de estudios <span style="margin-left:8px;vertical-align:middle">${semB(s.sem)}</span></h1><p>${esc(p.carrera)} · Plan ${p.plan} · horas, asignaturas, responsables y programas.</p></div>${carSel('carP')}</div>`+runBar('plan')+simNote()+
  `<div class="g" style="grid-template-columns:1fr 2fr;align-items:stretch">
    <div class="card cp"><div class="h2" style="margin-top:0">Estado de la información</div>${indHTML(x)}
      <div class="small muted" style="margin-top:8px">Avance promedio de programas ${x.av}% · ${x.cr}% de asignaturas con responsable</div></div>
    <div class="kpis" style="grid-template-columns:repeat(2,1fr)">
    <div class="kpi"><div class="l">Horas totales del plan</div><div class="v">${p.total}<small>mín. ${p.umb.minTotal} h</small></div><div class="s">${s.totOk?'Cumple el mínimo':'Por debajo del mínimo'}</div></div>
    <div class="kpi"><div class="l">Bloques que cumplen</div><div class="v">${s.blOk} de 4</div></div>
    <div class="kpi"><div class="l">Materias sin responsable</div><div class="v">${s.sinR}</div></div>
    <div class="kpi"><div class="l">Programas con observaciones</div><div class="v">${s.prog}<small>de ${p.asig.length}</small></div></div>
    <div class="kpi" style="grid-column:1/-1"><div class="l">Formación práctica</div><div class="v" style="color:${s.fp.est==='ok'?'#1E9E73':s.fp.est==='bajo'?'#E24B4A':'#8A9BB0'}">${s.fp.h}<small>mín. ${p.umb.minFP} h${s.fp.est==='nv'?' · total parcial':''}</small></div><div class="s">${esc(fpTxt(s.fp))}</div></div></div></div>
  <div class="h2">Horas por tipo de bloque <small>— la línea oscura marca el mínimo</small></div>
  <div class="card cp">${Object.keys(BQ).map(k=>hbRow(BQ[k],p.bloques[k],p.umb.minBloque[k])).join('')}${hbRow('Total del plan',p.total,p.umb.minTotal)}</div>
  <div class="h2">Asignaturas <small>— ${lista.length} de ${p.asig.length}</small></div>
  <div class="chips"><span class="chip${S.fasig?' on':''}" data-act="fasig">Mostrar solo asignaturas con alertas</span></div>
  <div class="tbl"><div class="th" style="grid-template-columns:${cols}"><span>Asignatura</span><span>Año</span><span>Bloque</span><span>Responsable de cátedra</span><span>Programa</span></div>${rows||'<div class="tr" style="grid-template-columns:1fr;color:#8A9BB0">No hay asignaturas con alertas.</div>'}</div>
  `+resHTML('plan');
}

/* ---------- 4 · Alertas (bandeja de pendientes) ---------- */
function vAlertas(){
  const c={alta:A.filter(a=>a.sev==='alta').length,media:A.filter(a=>a.sev==='media').length,info:A.filter(a=>a.sev==='info').length};
  const lista=A.filter(a=>(S.fsev==='todas'||a.sev===S.fsev)&&(S.famb==='todas'||a.amb===S.famb));
  const chipS=[['todas','Todas',A.length],['alta','Alta',c.alta],['media','Media',c.media],['info','Informativa',c.info]];
  const chipA=[['todas','Todos los ámbitos',A.length],...Object.keys(AMB).map(k=>[k,AMB[k],A.filter(a=>a.amb===k).length])];
  return ph('Alertas','Pendientes de toda la institución, ordenados por prioridad. Cada alerta lleva al docente o a la carrera de origen.')+simNote()+
  `<div class="chips"><b style="color:#4A6580;margin-right:4px">Prioridad:</b>${chipS.map(([k,l,n])=>`<span class="chip${S.fsev===k?' on':''}" data-act="fsev" data-v="${k}">${l}<b>${n}</b></span>`).join('')}</div>
  <div class="chips"><b style="color:#4A6580;margin-right:4px">Ámbito:</b>${chipA.map(([k,l,n])=>`<span class="chip${S.famb===k?' on':''}" data-act="famb" data-v="${k}">${l}<b>${n}</b></span>`).join('')}</div>
  ${lista.map(a=>alertRow(a,true)).join('')||'<div class="note info">No hay alertas con estos filtros.</div>'}`;
}

/* ---------- 5 · Reglas de validación (a integrar luego en un módulo de configuración) ---------- */
function setCfg(path,val,base=CFG){
  const ks=path.split('.');let o=base;
  for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=val;
}
function vReglas(){
  const inp=(path,label,val)=>`<div><label>${label}</label><input type="number" min="0" step="0.5" value="${val}" data-cfg="${path}"></div>`;
  const pu=planOf(S.carU),inpU=(path,label,val)=>`<div><label>${label}</label><input type="number" min="0" step="0.5" value="${val}" data-umb="${path}"></div>`;
  const cc='.3fr 3.4fr .8fr 1.2fr 1.3fr .5fr';
  return ph('Reglas de validación','Reglas que usa el sistema para detectar alertas y sus umbrales. Al modificar un umbral, todo se recalcula al instante.')+
  `<div class="tbl"><div class="th" style="grid-template-columns:${cc}"><span>N°</span><span>Regla</span><span>Tipo</span><span>Prioridad</span><span>Grupo de análisis</span><span>Casos</span></div>
   ${REGLAS.map(r=>`<div class="tr" style="grid-template-columns:${cc}"><b>${r.r}</b><span>${esc(r.t)}</span><span>${r.tipo}</span><span>${r.sev}</span><span>${Object.values(GRUPOS).filter(G=>G.r.includes(r.r)).map(G=>G.t).join('<br>')}</span><b>${r.tipo==='Indicador'?'—':A.filter(a=>a.r===r.r).length}</b></div>`).join('')}</div>
  <div class="card cp" style="margin-top:14px"><details class="umb"${S.umb?' open':''}><summary>Editar umbrales</summary>
     <div class="h2">Umbrales de la Facultad <small>— comunes a todos los docentes</small></div>
     <div class="ug">${inp('tope','Tope semanal: más de (h, doc. + gest. + no acad.)',CFG.tope)}${inp('bajaCarga','Baja dedicación: menos de (h totales)',CFG.bajaCarga)}${inp('maxMaterias','Sobre-asignación: más de (materias)',CFG.maxMaterias)}</div>
     <div class="h2">Umbrales del plan de estudios <small>— propios de cada plan</small></div>
     <div style="display:flex;gap:12px;flex-wrap:wrap">${carSel('carU')}<div class="csel"><label>Plan de estudios</label><select><option>Plan ${pu.plan}</option></select></div></div>
     <div class="ug">${inpU('minTotal','Horas mínimas totales del plan',pu.umb.minTotal)}${Object.keys(BQ).map(k=>inpU('minBloque.'+k,'Mínimo bloque '+k,pu.umb.minBloque[k])).join('')}
     ${inpU('minFP','Horas mínimas de formación práctica del plan',pu.umb.minFP)}</div></details></div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  e.stopPropagation();
  const v=t.dataset.v;
  switch(t.dataset.act){
    case 'go':go(t.dataset.s,v);break;
    case 'doc':go('docente',v);break;
    case 'fd':S.fd=v;render();break;
    case 'fsev':S.fsev=v;render();break;
    case 'famb':S.famb=v;render();break;
    case 'fasig':S.fasig=!S.fasig;render();break;
    case 'pdf':imprimir(t.dataset.k,v);break;
    case 'run':correr(t.dataset.g);break;
    case 'xpdf':imprimir('grp',t.dataset.g);break;
    case 'xxls':xlsGrupo(t.dataset.g);break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.sel){if(el.dataset.sel==='carD')S.carD=el.value;if(el.dataset.sel==='carP')S.carP=el.value;if(el.dataset.sel==='carU')S.carU=el.value;render();return}
  if(el.dataset&&el.dataset.umb){const n=parseFloat(el.value);if(!isNaN(n)&&n>=0){setCfg(el.dataset.umb,n,planOf(S.carU).umb);setTimeout(render)}return}
  if(el.dataset&&el.dataset.cfg){const n=parseFloat(el.value);if(!isNaN(n)&&n>=0){setCfg(el.dataset.cfg,n);setTimeout(render)}}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.umb'))S.umb=e.target.open},true);

render();
</script>
</body>
</html>
